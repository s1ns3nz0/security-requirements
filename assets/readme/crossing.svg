<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="cross-title cross-desc">
  <title id="cross-title">Baseline crossed against the threat model</title>
  <desc id="cross-desc">Two derivations meet. A FIPS 199 impact rating selects an SP 800-53B baseline of 350 controls, which supplies completeness. A data flow diagram put through STRIDE and LINDDUN produces 8 threats across 7 trust boundaries, which supplies relevance. Crossing the two sets gives 8 requirements raised in priority because a threat and a control agree, 3 additional requirements the baseline does not express at all, and 342 controls retained at lower priority. Counts are from the b2b-saas-aws golden case.</desc>

  <rect width="1200" height="440" rx="14" fill="#0B0D0E"/>

  <g id="input-lanes">
    <g id="lane-baseline">
      <line x1="64" y1="84" x2="64" y2="172" stroke="#3A4145" stroke-width="2"/>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" letter-spacing="1.4" fill="#6E767C">
        <tspan x="88" y="98">COMPLETENESS</tspan>
      </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="24" fill="#F3F1ED">
        <tspan x="88" y="136">FIPS 199 impact rating</tspan>
      </text>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#B9BFC4">
        <tspan x="88" y="166">SP 800-53B Moderate &#183; 350 controls</tspan>
      </text>
    </g>

    <g id="lane-threats">
      <line x1="64" y1="252" x2="64" y2="340" stroke="#3A4145" stroke-width="2"/>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" letter-spacing="1.4" fill="#6E767C">
        <tspan x="88" y="266">RELEVANCE</tspan>
      </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="24" fill="#F3F1ED">
        <tspan x="88" y="304">STRIDE and LINDDUN on the DFD</tspan>
      </text>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#B9BFC4">
        <tspan x="88" y="334">8 threats across 7 trust boundaries</tspan>
      </text>
    </g>
  </g>

  <g id="junction" fill="none" stroke="#3A4145" stroke-width="1.5">
    <path d="M508 128 H 536 Q 556 128 556 148 V 204"/>
    <path d="M508 296 H 536 Q 556 296 556 276 V 220"/>
    <path d="M556 212 H 604"/>
  </g>
  <circle cx="556" cy="212" r="4" fill="#6E767C"/>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" fill="#5C6469" text-anchor="middle">
    <tspan x="556" y="246">cross</tspan>
  </text>

  <g id="results">
    <line x1="624" y1="72" x2="1136" y2="72" stroke="#262B2E" stroke-width="1"/>

    <g id="row-raised">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="34" fill="#F3F1ED" text-anchor="end">
        <tspan x="712" y="128">8</tspan>
      </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="23" fill="#F3F1ED">
        <tspan x="744" y="122">threat and baseline agree</tspan>
      </text>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#6E767C">
        <tspan x="744" y="150">raised priority</tspan>
      </text>
      <line x1="624" y1="188" x2="1136" y2="188" stroke="#262B2E" stroke-width="1"/>
    </g>

    <g id="row-threat-only">
      <rect x="624" y="188" width="512" height="116" fill="#17140D"/>
      <rect x="624" y="188" width="3" height="116" fill="#E0A64A"/>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="34" fill="#E0A64A" text-anchor="end">
        <tspan x="712" y="244">3</tspan>
      </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="23" fill="#F3F1ED">
        <tspan x="744" y="238">threat only</tspan>
      </text>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#E0A64A">
        <tspan x="744" y="266">additional requirement</tspan>
      </text>
      <line x1="624" y1="304" x2="1136" y2="304" stroke="#262B2E" stroke-width="1"/>
    </g>

    <g id="row-baseline-only">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="34" fill="#B9BFC4" text-anchor="end">
        <tspan x="712" y="360">342</tspan>
      </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="23" fill="#B9BFC4">
        <tspan x="744" y="354">baseline only</tspan>
      </text>
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#6E767C">
        <tspan x="744" y="382">retained, lower priority</tspan>
      </text>
    </g>
  </g>

  <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="17" fill="#5C6469">
    <tspan x="64" y="404">the middle row is the reason this exists</tspan>
    <tspan x="64" y="428">counts from golden/b2b-saas-aws</tspan>
  </text>
</svg>
