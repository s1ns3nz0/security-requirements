<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="484" viewBox="0 0 1200 484"
     role="img" aria-labelledby="land-title land-desc">
  <title id="land-title">Where this sits among the other security tools for Claude Code</title>
  <desc id="land-desc">Two bands. Before there is code to read, security-requirements produces requirements, traceability, and a responsibility split, and Tachi produces threats, attack trees, and risk scores. Once there is code to read, the security guidance plugin fixes issues in the code Claude is writing, slash security-review returns findings on a branch, the Claude Security plugin returns findings and then patches, and SAST, SCA, and dependency scanners return rule matches and known CVEs.</desc>

  <rect width="1200" height="484" rx="14" fill="#0B0D0E"/>

  <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" letter-spacing="1.4" fill="#6E767C">
    <tspan x="64" y="54">WHERE IT SITS</tspan>
  </text>

  <g id="band-before">
    <line x1="64" y1="86" x2="64" y2="212" stroke="#E0A64A" stroke-width="2"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.2" fill="#E0A64A">
      <tspan x="88" y="102">BEFORE THERE IS CODE TO READ</tspan>
    </text>

    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="23" fill="#E0A64A">
      <tspan x="88" y="148">security-requirements</tspan>
    </text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#B9BFC4">
      <tspan x="520" y="147">requirements, traceability, responsibility split</tspan>
    </text>

    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="23" fill="#F3F1ED">
      <tspan x="88" y="192">Tachi</tspan>
    </text>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#B9BFC4">
      <tspan x="520" y="191">threats, attack trees, risk scores</tspan>
    </text>
  </g>

  <line x1="64" y1="244" x2="1136" y2="244" stroke="#262B2E" stroke-width="1"/>

  <g id="band-after">
    <line x1="64" y1="276" x2="64" y2="440" stroke="#3A4145" stroke-width="2"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="1.2" fill="#6E767C">
      <tspan x="88" y="292">ONCE THERE IS CODE TO READ</tspan>
    </text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
       font-size="23" fill="#B9BFC4">
      <text><tspan x="88" y="336">security guidance plugin</tspan></text>
      <text><tspan x="88" y="372">/security-review</tspan></text>
      <text><tspan x="88" y="408">Claude Security plugin</tspan></text>
      <text><tspan x="88" y="444">SAST, SCA, dependency scanning</tspan></text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
       font-size="18" fill="#8A9096">
      <text><tspan x="520" y="335">fixes in the code Claude is writing</tspan></text>
      <text><tspan x="520" y="371">findings on a branch</tspan></text>
      <text><tspan x="520" y="407">findings, then patches you apply</tspan></text>
      <text><tspan x="520" y="443">rule matches and known CVEs</tspan></text>
    </g>
  </g>
</svg>
