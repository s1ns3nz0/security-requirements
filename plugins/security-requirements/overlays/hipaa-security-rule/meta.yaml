id: hipaa-security-rule
name: "HIPAA Security Rule — 45 CFR Part 164 Subpart C"
name_en: "Security Standards for the Protection of Electronic Protected Health Information"
version: "2026-01-01"
criteria_count: 68

source:
  authority: "45 CFR Part 164, Subpart C"
  retrieved_from: "https://www.ecfr.gov/api/versioner/v1/full/{date}/title-45.xml?part=164"
  rebuild: 'python3 -I "<absolute plugin root>/scripts/rebuild_overlay_hipaa.py"'
  note: >-
    Derived from the regulation itself rather than from a secondary source. The
    extractor asserts the published shape -- nine administrative standards, four
    physical, five technical -- and refuses to write a clause list that does not
    match, so a change in the regulation or a regression in the parser fails
    loudly instead of shipping a short list nobody counts.

license:
  criteria_text: >-
    A work of the United States Government. Under 17 U.S.C. 105 it is not
    subject to copyright protection and is in the public domain, so the clause
    text is bundled as published.

# The Security Rule applies to covered entities and business associates
# handling electronic protected health information. Both halves matter: a
# processor holding another organisation's health data is in scope as a
# business associate, which is what the customer_owned modifier marks.
applies_when:
  user_regions_any: [US]
  data_types_any: [health_records]

designations:
  Required: 24
  Addressable: 22
  note: >-
    Addressable does not mean optional. Where a regulated entity does not
    implement an addressable specification it must document why, and implement
    an equivalent measure where reasonable and appropriate. A derivation that
    silently drops the addressable half would understate the obligation by
    nearly half.

baseline_effect: {}   # the Security Rule does not itself raise the FIPS 199 categorisation

mapping:
  authored: true
  published_crosswalk_exists: true
  published_crosswalk_retrievable: false
  note: >-
    This overlay was expected to be the first that would not have to author its
    own mapping: SP 800-66r2 publishes a HIPAA to SP 800-53 crosswalk. That
    turned out to be wrong in a way worth recording. Appendix D of 800-66r2
    states that the mapping table "has been removed from the document and
    placed online in the NIST Cybersecurity and Privacy Reference Tool", and
    every CPRT endpoint tried returns 404 -- the same wall that stopped the
    CSF-to-800-53 crosswalk earlier. The published mapping exists and cannot be
    fetched, so the control lists below are this repository's reading, exactly
    as in the ISMS-P overlay. Replace them with the CPRT export when it becomes
    reachable.

disclaimer: >-
  Mapping regulatory obligations onto technical controls is interpretation, not
  legal advice. This overlay does not establish HIPAA compliance, does not
  constitute a risk analysis under 164.308(a)(1)(ii)(A), and does not substitute
  for counsel.
