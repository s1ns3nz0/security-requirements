# Amazon S3 -- control responsibility
#
# reviewed: true means a human worked through each entry below against the
# control text and the service documentation. Entries generated by the model
# for services not yet curated carry reviewed: false and are marked as
# unverified wherever they appear in output.

service: aws-s3
provider: aws
display_name: "Amazon S3"
reviewed: true
reviewed_on: "2026-07-27"
families_covered: [AC, AU, SC]

# Only controls where S3 changes the layer default are listed. Everything else
# falls through to responsibility/layers.yaml.
controls:

  SC-28:
    responsibility: shared
    csp_part: "Operates the storage substrate and the SSE key infrastructure."
    team_part: >-
      Enable default bucket encryption and choose the key type. A bucket with
      no default encryption policy silently accepts unencrypted objects.
    evidence:
      - "AWS SOC 2 Type II report (control area: logical access, encryption)"
      - "terraform: aws_s3_bucket_server_side_encryption_configuration present"
    verification:
      method: iac_inspect
      target: "aws_s3_bucket_server_side_encryption_configuration"
      expect: "apply_server_side_encryption_by_default is set"

  SC-28(1):
    responsibility: shared
    csp_part: "Provides SSE-S3, SSE-KMS, and DSSE-KMS mechanisms."
    team_part: >-
      Select a customer-managed KMS key where the control requires key
      separation from the storage service. SSE-S3 uses provider-managed keys
      and does not give the organisation key custody.
    evidence:
      - "terraform: sse_algorithm and kms_master_key_id"
    verification:
      method: iac_inspect
      target: "aws_s3_bucket_server_side_encryption_configuration"
      expect: "sse_algorithm = aws:kms with a customer-managed key arn"

  AC-3:
    responsibility: team
    team_part: >-
      Bucket policy, IAM policy, and Block Public Access settings. S3 grants
      nothing by default, so every access path is one the team created.
    note: >-
      The common failure is not an over-broad policy but a bucket left outside
      the account-level Block Public Access setting.
    verification:
      method: iac_inspect
      target: "aws_s3_bucket_public_access_block"
      expect: "all four flags true unless public serving is an explicit requirement"

  AC-4:
    responsibility: shared
    csp_part: "VPC endpoint and endpoint policy machinery."
    team_part: >-
      Constrain which network paths may reach the bucket, and set
      aws:SourceVpce or aws:SourceIp conditions where data must not leave a
      controlled path.
    verification:
      method: iac_inspect
      target: "aws_s3_bucket_policy"
      expect: "condition keys restricting network origin"

  AC-6:
    responsibility: team
    team_part: >-
      Separate read, write, and delete grants. A single role holding
      s3:* across the bucket defeats the control regardless of who holds it.

  AC-21:
    responsibility: team
    team_part: >-
      Where objects are shared with third parties, control presigned URL
      lifetime and the role that signs them. A long-lived presigned URL is an
      unauthenticated access path that no bucket policy will show.
    verification:
      method: code_grep
      target: "getSignedUrl|generate_presigned_url"
      expect: "expiry bounded and short"

  AU-2:
    responsibility: shared
    csp_part: "CloudTrail records management events for the bucket by default."
    team_part: >-
      Data events (GetObject, PutObject) are not recorded unless explicitly
      enabled, and they are usually the events that matter for an object store.
    evidence:
      - "CloudTrail data event selector covering the bucket"
    verification:
      method: iac_inspect
      target: "aws_cloudtrail event_selector"
      expect: "data_resource of type AWS::S3::Object covering this bucket"

  AU-9:
    responsibility: shared
    csp_part: "Durability of the log store."
    team_part: >-
      Log destination must not be writable by the identities being audited.
      Writing S3 access logs into the same bucket is self-referential and lets
      an attacker overwrite their own trail.

  AU-11:
    responsibility: team
    team_part: >-
      Lifecycle policy for the retention period, and Object Lock where the
      retention must survive a compromised administrator.
    verification:
      method: iac_inspect
      target: "aws_s3_bucket_lifecycle_configuration"
      expect: "expiration matching the declared retention period"

  SC-8:
    responsibility: shared
    csp_part: "TLS termination on the S3 endpoint."
    team_part: >-
      Deny non-TLS access explicitly. S3 accepts HTTP unless the bucket policy
      refuses it with aws:SecureTransport.
    verification:
      method: iac_inspect
      target: "aws_s3_bucket_policy"
      expect: "Deny when aws:SecureTransport is false"

  SC-4:
    responsibility: team
    team_part: >-
      Prevent residual data exposure across tenants when object keys are
      reused or predictable. Include the tenant identifier in the key prefix
      and enforce it in the access policy.
