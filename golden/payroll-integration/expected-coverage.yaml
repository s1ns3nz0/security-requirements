# 골든 케이스 6 — 기대 커버리지
#
# 이 케이스는 두 가지를 동시에 채점한다. 하나는 도출된 요구사항이 급여 연동
# 계층의 실제 위험에 닿는지, 다른 하나는 한국어 문서가 한국어 규칙으로
# 검사되는 경로가 끝까지 살아 있는지다. 후자는 이 파일이 아니라 lint가
# 판정하지만, 이 케이스가 존재하는 이유의 절반이다.

version: "0.1.0"
profile: payroll-integration

topics:

  - id: unique-identifier-separation
    must_cover: true
    critical: true
    description: "주민등록번호가 다른 개인정보와 구분되는 보호를 받는다"
    match_any: [주민등록번호, 고유식별정보, 고유식별번호]
    why: >-
      개인정보보호법 제24조의2가 요구하는 것은 암호화 그 자체가 아니라
      다른 개인정보와 구분되는 조치다. 전체를 한 키로 암호화하고 끝내면
      법이 요구한 구분이 없다.

  - id: unique-identifier-retention
    must_cover: true
    critical: true
    description: "주민등록번호의 보유 근거가 끝나면 파기된다"
    match_any: [파기, 원천징수, 보유 근거, 보유 기간이 지난, 삭제되어야]
    why: >-
      보유 근거가 법정 신고 의무이므로 그 의무가 끝나면 근거도 사라진다.
      암호화만 다루고 파기를 빠뜨린 문서는 가장 흔한 형태의 미흡이다.

  - id: processor-transfer-scope
    must_cover: true
    critical: true
    description: "수탁자에게 전송되는 항목이 위탁 범위로 제한된다"
    match_any: [위탁, 수탁, 허용 목록, 처리 위탁]
    why: >-
      배포 형태가 제3자 애플리케이션 소비다. 이 시스템이 실제로 결정하는
      것은 무엇을 넘기느냐이고, 넘긴 뒤의 통제는 이쪽에 없다.

  - id: payment-record-integrity
    must_cover: true
    description: "확정된 지급 기록이 조용히 수정되지 않는다"
    match_any: [지급 기록, 정정 기록, 확정]
    why: >-
      rpo_zero를 선언한 이유가 여기다. 재구성할 상위 원본이 없는 기록은
      가용성 문제가 아니라 무결성 문제다.

  - id: vendor-assurance
    must_cover: true
    description: "벤더의 통제가 문서로 확인된다"
    match_any: [감사 보고서, 계약 갱신]
    why: >-
      saas 배포에서 SA-9가 일차 통제가 되는 이유. 이쪽이 가진 것은 벤더
      관계뿐이므로, 그 관계에서 증거를 받아내는 것이 통제다.

  - id: inbound-callback-authenticity
    must_cover: true
    description: "벤더가 보내는 콜백의 발신자가 검증된다"
    match_any: [웹훅, 서명]
    why: >-
      지급 상태가 급여 기록을 확정시킨다. 검증 없는 콜백은 지급 사실을
      위조하는 경로이고, 엔트리포인트 목록을 읽어야만 보이는 위험이다.

must_not_cover:

  - id: no-infrastructure-hardening
    match_any: [커널, 방화벽 규칙, 패치 적용, 하이퍼바이저, 물리 접근]
    why: >-
      제3자 SaaS를 소비하는 연동 계층이다. 인프라 하드닝 요구사항이
      나오면 배포 형태를 읽지 않고 High 베이스라인을 그대로 옮긴 것이며,
      팀이 실행할 수 없는 항목이 목록을 채우면 읽히지 않는 문서가 된다.

  - id: no-cardholder-data-controls
    match_any: [카드번호, PAN, 카드소지자, PCI]
    why: >-
      계좌번호는 카드 데이터가 아니다. 둘을 같이 묶으면 PCI DSS 범위가
      아닌 시스템에 카드데이터 환경 요구사항이 붙는다.

# 힌트를 좁힌 이유. 첫 판에서는 '벤더', '기록', '이력' 같은 넓은 단어를 넣었고
# 그 결과 감사 로그 요구사항 하나가 여섯 주제 중 다섯에 매칭되며 recall 100%가
# 나왔다. eval_golden 자신의 주석이 말하는 실패 -- 통과할 때까지 힌트를 넓히면
# 채점이 아무것도 재지 않게 된다 -- 를 이 파일이 저지르고 있었다. 지금 힌트는
# 그 주제를 다루지 않고는 쓸 수 없는 표현만 남겼다.

scoring:
  recall_threshold: 0.80
