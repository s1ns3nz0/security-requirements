# Golden case 4 -- direct-to-consumer commerce handling card data
#
# SYNTHETIC. No real organisation is described here.
#
# The high-impact case, and the one that must fire every uncovered-regulation
# path at once: raw cardholder data (PCI DSS), EU customers (GDPR), and storage
# outside the customers' region (cross-border transfer). None of these are
# supported by v1, and the correct behaviour is to say so plainly rather than
# produce requirements that imply coverage.
#
# It also exercises the IaaS deployment model, where infrastructure controls
# that are provider-claimed on serverless return to the team.

