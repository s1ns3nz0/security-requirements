# External runs, recorded as axis values.
#
# Golden cases are not listed here. `scripts/axis_coverage.py` re-derives them,
# so they need no bookkeeping and cannot drift from what the tool actually does.
# This file holds only what cannot be re-derived: a run against a repository
# outside this one.
#
# What is deliberately absent
# ---------------------------
# The derived profile. A profile says where a system's data lives, what it is
# worth, and which controls are not in place. Publishing one for a third-party
# project is an assessment of someone else's system that nobody asked for, and
# the fact that their code is public does not make our reading of it theirs to
# have published. Axis values carry the evidence -- "this run witnessed the
# HIPAA overlay" -- without carrying the assessment.
#
# What `witnessed` means
# ----------------------
# Not what the profile declared. A run witnesses an axis value only when a
# result appeared that could not have come from anywhere else:
#
#   overlay          the overlay evaluated and returned clauses
#   origin           merge.cross emitted an item carrying that origin
#   locale           lint ran with that locale and applied its rules
#   data_type        the type was declared and reached the derivation
#   responsibility   a control landed in that bucket
#
# Sixty-nine repositories were once run with an empty threats file, so on real
# input the merge stage had only ever produced `baseline_only` and
# `forced_by_data_type`. The input was there and the code never ran. Recording
# declarations rather than witnesses is how that stays invisible.
#
# Entry shape
# -----------
#   - repository: github.com/owner/name
#     commit: <sha, so the run is reproducible>
#     run_on: YYYY-MM-DD
#     chosen_for: which empty axis this was picked to fill
#     witnessed:
#       overlay: [hipaa-security-rule]
#       data_type: [health_records]
#     defects: <count found, and the commits that fixed them>

# Why the remaining axes are open
# -------------------------------
# Four providers (alibaba, ibm, oci, tencent), three data types (minors_data,
# ml_training_data, public_content), and four modifiers are reported as never
# exercised, and are deliberately left that way.
#
# All of them are swept through the derivation by the test suite, so no code
# path is unrun. What is missing is a realistic profile carrying them, and the
# release criteria settled on closing only the axes the next real service will
# actually hit. Manufacturing a profile to move a counter would produce a
# fixture nobody would recognise, which is the failure the golden set is
# supposed to be the opposite of -- and it would make the report say covered
# about a shape that had still never been seen.
#
# The four providers additionally have no curated service file. A profile
# naming one would witness the axis and add nothing: the split falls back to
# the deployment layer either way, and that fallback is already tested. What
# would move them meaningfully is curation, not a profile.

version: "0.1.0"

runs:

  - repository: github.com/openemr/openemr
    commit: 966e6ed
    run_on: "2026-07-28"
    chosen_for: "health_records and the HIPAA overlay, neither of which any run had carried"
    witnessed:
      overlay: [hipaa-security-rule]
      data_type: [health_records, government_id, sensitive_attributes,
                  basic_contact, account_credentials, audit_logs, app_logs]
      csp: [none]
      deployment_model: [onprem]
      baseline: [high]
      responsibility: [org, team]
      locale: [en]
    defects: 1
    note: >-
      First HIPAA evaluation of any profile: 68 of 68 specifications reached,
      31 of them only through controls the organisation owns. The defect was
      not HIPAA's -- `onprem-us` did not resolve to a country, so the
      cross-border question was never asked. The region map held bare region
      codes and every prefixed form failed silently.

  - repository: github.com/openemr/openemr
    commit: 966e6ed
    run_on: "2026-07-28"
    chosen_for: "the model half of the pipeline, which had never run on real input"
    witnessed:
      overlay: [hipaa-security-rule]
      origin: [threat_only, threat_and_baseline, baseline_only, forced_by_data_type]
      data_type: [health_records, government_id, sensitive_attributes,
                  basic_contact, account_credentials, audit_logs, app_logs]
      csp: [none]
      deployment_model: [onprem]
      baseline: [high]
      responsibility: [org, team]
      locale: [en]
    defects: 1
    note: >-
      The second run against this repository and the first end to end anywhere.
      Steps 5 and 8 -- threat model and requirement writing -- had only ever run
      on synthetic profiles; every external round before this one supplied an
      empty threats file. The threat model was written from the code rather than
      the profile, and six threats produced two the baseline could not reach.

      The defect came out of reading the eight requirements as the maintainer
      would. Two were rejected because they demanded an organisation that does
      not exist -- a second approver where the profile declares no
      organisational controls at all, and a multi-facility authorisation model
      for a single-site deployment. The profile held both answers and nothing
      read them. Fixed by a fourth rule in the style guide and a note in the
      responsibility report.

  - repository: github.com/dani-garcia/vaultwarden
    commit: 2629bcb
    run_on: "2026-07-30"
    chosen_for: "a second rejection pass, on a shape where the data is entirely credentials"
    witnessed:
      overlay: [pipa-isms-p]
      origin: [threat_only, threat_and_baseline, baseline_only, forced_by_data_type]
      data_type: [account_credentials, basic_contact, app_logs]
      modifier: [service_content]
      csp: [none]
      deployment_model: [onprem]
      baseline: [high]
      responsibility: [org, team]
      locale: [en]
    defects: 2
    note: >-
      The first real profile to carry `service_content` on account_credentials,
      which is the Keycloak design change from earlier: credentials are system
      information in most services and are the content in this one, so they now
      count toward the water mark instead of being excluded from it.

      Six requirements, two rejected, and the two rejections were a different
      pattern from OpenEMR's. One demanded the server refuse weak registration
      parameters, which would break the official client this project exists to
      stay compatible with -- a constraint the profile had no field for.
      The other asked the server to check a password hint against the master
      password, which the server never receives: `auth_mechanism` already said
      the client sends a derived key, and the requirement contradicted it.
      One field added, rule 4 widened to name both.

  - repository: github.com/Azure-Samples/azure-search-openai-demo
    commit: 3f4a21f
    run_on: "2026-07-28"
    chosen_for: "csp azure, and the customer_owned modifier"
    witnessed:
      csp: [azure]
      deployment_model: [paas]
      data_type: [user_generated_content, basic_contact, config_secrets, app_logs]
      modifier: [customer_owned]
      baseline: [moderate]
      responsibility: [team, shared, csp_claimed, org]
      locale: [en]
    defects: 0
    note: >-
      The customer_owned modifier produced the processor_role threat flag and
      the data_processor_obligations forced requirement, which is the path it
      exists for. Four Azure services came back unverified -- only azure-blob
      is curated -- so the split fell back to the deployment model layer.
